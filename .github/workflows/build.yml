name: build-portable

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a DRAFT release (publish manually afterwards)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ---------- tests ----------
  # Runs on a clean machine before anything is built. Fail fast: a bundle that
  # cannot pass its own unit + negative tests must never reach a release.
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0.0
          Import-Module Pester
          Write-Host ("Pester {0} ready" -f (Get-Module Pester).Version)

      - name: Assert shipped scripts are ASCII-only or BOM-marked
        shell: pwsh
        timeout-minutes: 3
        run: ./tools/assert-ascii.ps1

      - name: Run the unit + negative test suite
        shell: pwsh
        timeout-minutes: 8
        run: |
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $c
          Write-Host ("tests: total={0} passed={1} failed={2}" -f $r.TotalCount, $r.PassedCount, $r.FailedCount)
          if ($r.FailedCount -gt 0) { throw ("{0} test(s) failed" -f $r.FailedCount) }

  portable:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Read deps.json
        id: deps
        shell: pwsh
        run: |
          $d = Get-Content deps.json -Raw | ConvertFrom-Json
          "node=$($d.node)"       >> $env:GITHUB_OUTPUT
          "dsh=$($d.dsh.version)" >> $env:GITHUB_OUTPUT
          "pnpm=$($d.pnpm)"       >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        with:
          node-version: "${{ steps.deps.outputs.node }}"

      # The bundle ships node\ with the global dsh install inside it (that is how
      # the local layout works: npm's prefix == the node dir). A plain
      # `npm config set prefix` proved unreliable on the runner, so set the env
      # var (which beats any .npmrc), verify, and graft the tree in as a fallback.
      - name: Install dsh into the Node dir (mirrors the local layout)
        shell: pwsh
        run: |
          $ver     = "${{ steps.deps.outputs.dsh }}"
          $nodeDir = Split-Path (Get-Command node).Source -Parent
          $env:NPM_CONFIG_PREFIX = $nodeDir
          Write-Host "nodeDir : $nodeDir"
          Write-Host "prefix  : $(npm config get prefix)"
          Write-Host "root -g : $(npm root -g)"
          npm install -g "@deepseek-ai/dsh@$ver"

          $probe = Join-Path $nodeDir 'node_modules\@deepseek-ai\dsh\package.json'
          if (-not (Test-Path -LiteralPath $probe)) {
            Write-Host "--- dsh is not in the Node dir; diagnosing ---"
            Write-Host "prefix  : $(npm config get prefix)"
            Write-Host "root -g : $(npm root -g)"
            Get-ChildItem -LiteralPath $nodeDir -ErrorAction SilentlyContinue |
              Select-Object -First 25 -ExpandProperty Name | Write-Host
            Write-Host "--- fallback: install to a temp dir and graft the tree in ---"
            $tmp = Join-Path $env:RUNNER_TEMP 'dshgraft'
            npm install --prefix $tmp --no-save "@deepseek-ai/dsh@$ver"
            $graft = Join-Path $tmp 'node_modules'
            if (-not (Test-Path -LiteralPath (Join-Path $graft '@deepseek-ai\dsh\package.json'))) {
              throw "graft install failed too"
            }
            $target = Join-Path $nodeDir 'node_modules'
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            robocopy $graft $target /E /NFL /NDL /NJH /NJS /NP | Out-Null
            # the shims must sit next to node.exe so bare `dsh` resolves on PATH
            foreach ($b in @('dsh', 'dsh.cmd', 'dsh.ps1')) {
              $s = Join-Path $tmp "node_modules\.bin\$b"
              if (Test-Path -LiteralPath $s) { Copy-Item -LiteralPath $s -Destination $nodeDir -Force }
            }
          }
          if (-not (Test-Path -LiteralPath $probe)) { throw "dsh still missing at $probe" }
          Write-Host ("OK dsh {0} is in the Node dir" -f (Get-Content -LiteralPath $probe -Raw | ConvertFrom-Json).version)

      - name: Prepare profile + staging layout
        shell: pwsh
        run: ./tools/ci-prepare.ps1 -PnpmVersion "${{ steps.deps.outputs.pnpm }}"

      - name: Assert all 3 plugins composed (fail fast on silent no-op)
        shell: pwsh
        run: |
          $dump = (& dsh --profile web --dump-config 2>&1 | Out-String)
          foreach ($p in @('dsh-whale-widget','open-sea-skin','dsh-whale-galgame')) {
            if ($dump -notmatch [regex]::Escape($p)) { throw "plugin NOT composed: $p" }
          }
          Write-Host "OK - all 3 plugins composed"

      # ---------- build ----------
      - name: Build the portable folder
        shell: pwsh
        run: ./build-package.ps1 -Src ./staging -Out ./out -NoZip

      - name: Verify the built package (integrity gates)
        shell: pwsh
        run: ./tools/verify-package.ps1 -Pkg ./out/DSH-Portable

      # ---------- archive: MUST happen before anything runs the package ----------
      # Running dsh self-heals data\.dsh\profiles\node_modules into symlinks and
      # tar follows them (the zip would jump ~145MB -> ~290MB). The build script
      # also strips them right before zipping; this ordering is the second guard.
      - name: Zip + SHA256
        shell: pwsh
        run: |
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -a -c -f ./out/DSH-Portable.zip -C ./out DSH-Portable
          if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
          $h = Get-FileHash ./out/DSH-Portable.zip -Algorithm SHA256
          "$($h.Hash.ToLower())  DSH-Portable.zip" | Set-Content ./out/SHA256SUMS.txt -Encoding ASCII
          Get-Content ./out/SHA256SUMS.txt
          Write-Host ("zip: {0:N1} MB" -f ((Get-Item ./out/DSH-Portable.zip).Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Portable
          path: |
            out/DSH-Portable.zip
            out/SHA256SUMS.txt
          retention-days: 14

      # ---------- end-to-end: really run the package on a clean machine ----------
      # The script injects a fake sk- key itself, so no secret is needed.
      # It starts/stops the Web server (-Port 3099) and exits 1 on any change
      # outside the bundle. It runs AFTER the zip on purpose.
      - name: End-to-end isolation test (runs the package for real)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $pkg = Resolve-Path ./out/DSH-Portable
          & (Join-Path $pkg 'tools\verify-isolation.ps1') -Rounds 2 -Port 3099
          if ($LASTEXITCODE -ne 0) { throw "isolation verification FAILED (exit $LASTEXITCODE)" }
          Write-Host "isolation verification PASSED"

      # ---------- release ----------
      # Idempotent on purpose: re-running the same tag (a fix, a retry, a moved
      # tag) must refresh the draft instead of failing on "release already exists".
      - name: Create or refresh the DRAFT release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = "${{ github.ref_name }}"
          $zip  = './out/DSH-Portable.zip'
          $sums = './out/SHA256SUMS.txt'
          gh release view $tag 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            Write-Host "release $tag already exists - refreshing the draft"
            gh release edit $tag --draft --title "$tag"
            if ($LASTEXITCODE -ne 0) { throw "release edit failed ($LASTEXITCODE)" }
            gh release upload $tag $zip $sums --clobber
            if ($LASTEXITCODE -ne 0) { throw "release upload failed ($LASTEXITCODE)" }
          } else {
            gh release create $tag $zip $sums --draft --title "$tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "release create failed ($LASTEXITCODE)" }
          }
          Write-Host "DRAFT release $tag ready - publish it manually."
