name: build-portable

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a DRAFT release (publish manually afterwards)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ---------- tests ----------
  # Runs on a clean machine before anything is built. Fail fast: a bundle that
  # cannot pass its own unit + negative tests must never reach a release.
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0.0
          Import-Module Pester
          Write-Host ("Pester {0} ready" -f (Get-Module Pester).Version)

      - name: Assert shipped scripts are ASCII-only or BOM-marked
        shell: pwsh
        timeout-minutes: 3
        run: ./tools/assert-ascii.ps1

      - name: Run the unit + negative test suite
        shell: pwsh
        timeout-minutes: 8
        run: |
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $c
          Write-Host ("tests: total={0} passed={1} failed={2}" -f $r.TotalCount, $r.PassedCount, $r.FailedCount)
          if ($r.FailedCount -gt 0) { throw ("{0} test(s) failed" -f $r.FailedCount) }

  portable:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Read deps.json
        id: deps
        shell: pwsh
        run: |
          $d = Get-Content deps.json -Raw | ConvertFrom-Json
          "node=$($d.node)"       >> $env:GITHUB_OUTPUT
          "dsh=$($d.dsh.version)" >> $env:GITHUB_OUTPUT
          "pnpm=$($d.pnpm)"       >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v5
        with:
          node-version: "${{ steps.deps.outputs.node }}"

      # The bundle ships node\ with the global dsh install inside it (that is how
      # the local layout works: npm's prefix == the node dir). A plain
      # `npm config set prefix` proved unreliable on the runner, so set the env
      # var (which beats any .npmrc), verify, and graft the tree in as a fallback.
      - name: Install dsh into the Node dir (mirrors the local layout)
        shell: pwsh
        run: |
          $ver     = "${{ steps.deps.outputs.dsh }}"
          $nodeDir = Split-Path (Get-Command node).Source -Parent
          $env:NPM_CONFIG_PREFIX = $nodeDir
          Write-Host "nodeDir : $nodeDir"
          Write-Host "prefix  : $(npm config get prefix)"
          Write-Host "root -g : $(npm root -g)"
          npm install -g "@deepseek-ai/dsh@$ver"

          $probe = Join-Path $nodeDir 'node_modules\@deepseek-ai\dsh\package.json'
          if (-not (Test-Path -LiteralPath $probe)) {
            Write-Host "--- dsh is not in the Node dir; diagnosing ---"
            Write-Host "prefix  : $(npm config get prefix)"
            Write-Host "root -g : $(npm root -g)"
            Get-ChildItem -LiteralPath $nodeDir -ErrorAction SilentlyContinue |
              Select-Object -First 25 -ExpandProperty Name | Write-Host
            Write-Host "--- fallback: install to a temp dir and graft the tree in ---"
            $tmp = Join-Path $env:RUNNER_TEMP 'dshgraft'
            npm install --prefix $tmp --no-save "@deepseek-ai/dsh@$ver"
            $graft = Join-Path $tmp 'node_modules'
            if (-not (Test-Path -LiteralPath (Join-Path $graft '@deepseek-ai\dsh\package.json'))) {
              throw "graft install failed too"
            }
            $target = Join-Path $nodeDir 'node_modules'
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            robocopy $graft $target /E /NFL /NDL /NJH /NJS /NP | Out-Null
            # the shims must sit next to node.exe so bare `dsh` resolves on PATH
            foreach ($b in @('dsh', 'dsh.cmd', 'dsh.ps1')) {
              $s = Join-Path $tmp "node_modules\.bin\$b"
              if (Test-Path -LiteralPath $s) { Copy-Item -LiteralPath $s -Destination $nodeDir -Force }
            }
          }
          if (-not (Test-Path -LiteralPath $probe)) { throw "dsh still missing at $probe" }
          Write-Host ("OK dsh {0} is in the Node dir" -f (Get-Content -LiteralPath $probe -Raw | ConvertFrom-Json).version)

      - name: Prepare profile + staging layout
        shell: pwsh
        run: ./tools/ci-prepare.ps1 -PnpmVersion "${{ steps.deps.outputs.pnpm }}"

      - name: Assert all 3 plugins composed (fail fast on silent no-op)
        shell: pwsh
        run: |
          $dump = (& dsh --profile web --dump-config 2>&1 | Out-String)
          foreach ($p in @('dsh-whale-widget','open-sea-skin','dsh-whale-galgame')) {
            if ($dump -notmatch [regex]::Escape($p)) { throw "plugin NOT composed: $p" }
          }
          Write-Host "OK - all 3 plugins composed"

      # ---------- build ----------
      - name: Materialise the signing certificate from the repository secret
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host '::warning::SIGN_PFX_BASE64 is not set - this build ships an unsigned exe'
            exit 0
            }
          $p = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX_B64))
          Write-Host ("PFX ready: {0} bytes" -f (Get-Item $p).Length)

      - name: Build the portable folder
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # Named (hashtable) splatting on purpose: the script declares [CmdletBinding()],
          # so a name/value pair cannot be smuggled through as bare positional strings.
          $p = @{ Src = './staging'; Out = './out'; NoZip = $true }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          if ((Test-Path -LiteralPath $pfx) -and $env:SIGN_PFX_PASSWORD) {
            $p.SignPfx = $pfx
            $p.SignPfxPassword = $env:SIGN_PFX_PASSWORD
          } else {
            Write-Host '::warning::signing secrets unavailable - building an unsigned package'
          }
          ./build-package.ps1 @p

      - name: Verify the built package (integrity gates)
        shell: pwsh
        run: ./tools/verify-package.ps1 -Pkg ./out/DSH-Portable

      # ---------- archive: MUST happen before anything runs the package ----------
      # Running dsh self-heals data\.dsh\profiles\node_modules into symlinks and
      # tar follows them (the zip would jump ~145MB -> ~290MB). The build script
      # also strips them right before zipping; this ordering is the second guard.
      - name: Zip + SHA256 (+ GPG signature)
        shell: pwsh
        env:
            GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
            GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        run: |
          $zipMaker = Join-Path $PWD 'tools/make-zip.ps1'
          & $zipMaker -Source ./out/DSH-Portable -Zip ./out/DSH-Portable.zip
          if ($LASTEXITCODE -ne 0) { throw "make-zip failed ($LASTEXITCODE)" }

          # Gate: the archive must survive a round trip with its Chinese names intact.
          # tar.exe (bsdtar) writes file names in the ANSI code page, which turned them into
          # 'DSH ???.exe' / '?? DSH.vbs' on this runner - and no earlier step noticed, because
          # every other gate runs against the *folder*, not the zip.
          $probe = Join-Path $env:RUNNER_TEMP 'zipcheck'
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath ./out/DSH-Portable.zip -DestinationPath $probe -Force
          foreach ($f in @('DSH 便携版.exe', '启动 DSH.vbs', '使用说明.txt', 'README-使用说明.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $probe ('DSH-Portable/' + $f)))) {
              throw "zip round-trip lost a file name: $f"
            }
          }
          # (-match, not -like: in -like a bare ? is a wildcard and matches every name)
          if (Get-ChildItem -LiteralPath (Join-Path $probe 'DSH-Portable') -Recurse -Force | Where-Object { $_.Name -match '\?' }) {
            throw 'zip contains names with question marks - the archiver mangled non-ASCII names'
          }
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'zip round-trip OK - Chinese file names survive the archive'
          $h = Get-FileHash ./out/DSH-Portable.zip -Algorithm SHA256
          "$($h.Hash.ToLower())  DSH-Portable.zip" | Set-Content ./out/SHA256SUMS.txt -Encoding ASCII
          Get-Content ./out/SHA256SUMS.txt
          Write-Host ("zip: {0:N1} MB" -f ((Get-Item ./out/DSH-Portable.zip).Length / 1MB))

          # ---- GPG: sign the checksums so a download can be traced to this repo ----
          $cand = @((Get-Command gpg -ErrorAction SilentlyContinue).Source)
          $cand += Join-Path $env:ProgramFiles 'Git\usr\bin\gpg.exe'
          $cand += Join-Path $env:ProgramFiles 'Git\mingw64\bin\gpg.exe'
          $gpg = $cand | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if ($gpg -and $env:GPG_PRIVATE_KEY) {
            $gpgHome = Join-Path $env:RUNNER_TEMP 'gnupg'
            New-Item -ItemType Directory -Path $gpgHome -Force | Out-Null
            # runner 上的 gpg 是 MSYS 版：它把 GNUPGHOME 当 POSIX 路径读，
            # 传 'D:\a\_temp\gnupg' 会拼成 '/d/a/.../D:\a\_temp\gnupg' 从而找不到 keyring。
            $env:GNUPGHOME = '/' + $gpgHome.Substring(0,1).ToLower() + ($gpgHome.Substring(2) -replace '\\','/')
            New-Item -ItemType Directory -Path $env:GNUPGHOME -Force | Out-Null
            $keyFile = Join-Path $env:RUNNER_TEMP 'release-signing-key.asc'
            Set-Content -LiteralPath $keyFile -Value $env:GPG_PRIVATE_KEY -Encoding ASCII
            & $gpg --batch --import $keyFile 2>&1 | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "gpg import failed ($LASTEXITCODE)" }
            Write-Host 'secret keys in this keyring:'
            & $gpg --batch --list-secret-keys --with-colons | Select-String '^fpr:' | Write-Host
            # 显式指定用哪把私钥：secret 里若有多把，之前签的是哪把不受控
            & $gpg --batch --yes --armor --local-user $env:GPG_KEY_FINGERPRINT --detach-sign --output ./out/SHA256SUMS.txt.asc ./out/SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw "gpg signing failed ($LASTEXITCODE)" }
            & $gpg --verify ./out/SHA256SUMS.txt.asc ./out/SHA256SUMS.txt 2>&1 | Write-Host
            if ($LASTEXITCODE -ne 0) { throw 'verifying our own signature failed' }
            Write-Host "OK SHA256SUMS.txt.asc signed with $($env:GPG_KEY_FINGERPRINT)"
          } else {
            Write-Host '::warning::no GPG key available - SHA256SUMS.txt ships unsigned'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Portable
          path: |
            out/DSH-Portable.zip
            out/SHA256SUMS.txt
            out/SHA256SUMS.txt.asc
          retention-days: 14

      # ---------- end-to-end: really run the package on a clean machine ----------
      # The script injects a fake sk- key itself, so no secret is needed.
      # It starts/stops the Web server (-Port 3099) and exits 1 on any change
      # outside the bundle. It runs AFTER the zip on purpose.
      - name: End-to-end isolation test (runs the package for real)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $pkg = Resolve-Path ./out/DSH-Portable
          & (Join-Path $pkg 'tools\verify-isolation.ps1') -Rounds 2 -Port 3099
          if ($LASTEXITCODE -ne 0) { throw "isolation verification FAILED (exit $LASTEXITCODE)" }
          Write-Host "isolation verification PASSED"

      # ---------- signature gate ----------
      - name: Assert the launcher exe is signed
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $exe = './out/DSH-Portable/DSH 便携版.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host 'no exe in this build - nothing to check'; exit 0 }
          $s = Get-AuthenticodeSignature -LiteralPath $exe
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          if (Test-Path -LiteralPath $pfx) {
            # A self-signed cert has no chain on a machine that has not imported the .cer, so the
            # status reads UnknownError even though the signature landed correctly. Judge it by
            # 'who signed it', not by the chain status.
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
                $pfx, $env:SIGN_PFX_PASSWORD,
                [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            if (-not $s.SignerCertificate -or $s.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "the exe is not signed by the release certificate ($($s.Status))"
            }
            Write-Host ("OK - launcher exe signed by {0} (chain status {1}; importing the .cer makes it Valid)" -f $s.SignerCertificate.Subject, $s.Status)
          } else {
            Write-Host '::warning::no signing certificate in this run - the exe is unsigned'
          }

      # ---------- release ----------
      # Idempotent on purpose: re-running the same tag (a fix, a retry, a moved
      # tag) must refresh the draft instead of failing on "release already exists".
      - name: Create or refresh the DRAFT release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = "${{ github.ref_name }}"
          $zip  = './out/DSH-Portable.zip'
          $sums = './out/SHA256SUMS.txt'
          $sig  = './out/SHA256SUMS.txt.asc'
          $assets = @($zip, $sums)
          if (Test-Path -LiteralPath $sig) { $assets += $sig }
          gh release view $tag 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            Write-Host "release $tag already exists - refreshing the draft"
            gh release edit $tag --draft --title "$tag"
            if ($LASTEXITCODE -ne 0) { throw "release edit failed ($LASTEXITCODE)" }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "release upload failed ($LASTEXITCODE)" }
          } else {
            gh release create $tag @assets --draft --title "$tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "release create failed ($LASTEXITCODE)" }
          }
          Write-Host "DRAFT release $tag ready - publish it manually."